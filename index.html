<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javed AI Photo Editor - Remove BG & Background Changer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #1e3c72; font-size: 22px; margin-bottom: 5px; }
        p { font-size: 14px; color: #555; margin-top: 0; }
        .action-btn {
            display: block;
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            box-sizing: border-box;
        }
        .bg-btn { background-color: #e67e22; }
        .custom-btn { background-color: #3498db; }
        .download-btn { background-color: #8e44ad; display: none; }
        #canvas {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        #loading {
            display: none;
            color: #e67e22;
            font-weight: bold;
            margin: 15px 0;
        }
        .bg-selector {
            display: none;
            margin-top: 15px;
            text-align: left;
        }
        .bg-selector label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #1e3c72;
        }
        .bg-selector select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
            margin-bottom: 10px;
        }
        .ad-box {
            margin-top: 25px;
            padding: 15px;
            background: #fdf6ec;
            border: 2px dashed #f39c12;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎨 Javed AI Photo Editor</h1>
        <p>Remove BG & Travel Europe or Add Custom BG <br>(بیک گراؤنڈ ختم کریں یا اپنی مرضی کا لگائیں)</p>
        
        <hr>

        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <button class="action-btn" id="uploadTriggerBtn">🖼️ Upload Photo (تصویر منتخب کریں)</button>

        <div id="loading">⏳ Processing with AI... Please wait! (پروسیسنگ ہو رہی ہے)</div>

        <canvas id="canvas"></canvas>

        <div id="toolsSection" style="display: none;">
            <button class="action-btn bg-btn" id="removeBgBtn">✂️ 1. Remove BG (بیک گراؤنڈ ختم کریں)</button>
            
            <div class="bg-selector" id="bgSelector">
                <label for="europeBg">🏰 Choose Background (بیک گراؤنڈ منتخب کریں):</label>
                <select id="europeBg">
                    <option value="none">Transparent (بغیر بیک گراؤنڈ)</option>
                    <option value="eiffel">🗼 Paris - Eiffel Tower (پیرس)</option>
                    <option value="colosseum">🏛️ Rome - Colosseum (روم)</option>
                    <option value="bigben">🕰️ London - Big Ben (لندن)</option>
                    <option value="alps">🏔️ Swiss Alps (سوئٹزرلینڈ)</option>
                    <option value="white">⚪ Plain White (پاسپورٹ سفید)</option>
                    <option value="blue">🔵 Plain Blue (پاسپورٹ نیلا)</option>
                    <option value="red">🔴 Plain Red (پاسپورٹ سرخ)</option>
                </select>

                <input type="file" id="customBgInput" accept="image/*" style="display: none;">
                <button class="action-btn custom-btn" id="customBgBtn">🖼️ Upload Custom BG (اپنی گیلری سے بیک گراؤنڈ لگائیں)</button>
            </div>

            <a id="downloadBtn" class="action-btn download-btn" download="javed-ai-edited.png">📥 Download Image (ڈاؤن لوڈ کریں)</a>
        </div>

        <!-- ایڈسینس اشتہار کا ڈبا -->
        <div class="ad-box">
            <p>📢 <strong>Google AdSense Space</strong></p>
            <small>Google Ads will display here for earnings!</small>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const uploadTriggerBtn = document.getElementById('uploadTriggerBtn');
        const removeBgBtn = document.getElementById('removeBgBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const loading = document.getElementById('loading');
        const toolsSection = document.getElementById('toolsSection');
        const bgSelector = document.getElementById('bgSelector');
        const europeBgSelect = document.getElementById('europeBg');
        const customBgInput = document.getElementById('customBgInput');
        const customBgBtn = document.getElementById('customBgBtn');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let selectedFile = null;
        let cutOutImg = new Image();

        const europeBgUrls = {
            eiffel: 'https://images.unsplash.com/photo-1511739001486-6bfe10ce785f?w=800',
            colosseum: 'https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=800',
            bigben: 'https://images.unsplash.com/photo-1529655683826-aba9b3e77383?w=800',
            alps: 'https://images.unsplash.com/photo-1530122037265-a5f1f91d3b99?w=800'
        };

        uploadTriggerBtn.addEventListener('click', () => {
            imageInput.value = null;
            imageInput.click();
        });

        imageInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        canvas.style.display = 'block';
                        toolsSection.style.display = 'block';
                        bgSelector.style.display = 'none';
                        downloadBtn.style.display = 'none';
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(selectedFile);
            }
        });

        removeBgBtn.addEventListener('click', () => {
            if (!selectedFile) return;

            loading.style.display = 'block';
            toolsSection.style.display = 'none';

            const formData = new FormData();
            formData.append('image_file', selectedFile);
            formData.append('size', 'auto');

            fetch('https://api.remove.bg/v1.0/removebg', {
                method: 'POST',
                headers: { 'X-Api-Key': 'XGEnbBRh8E65Nx64ja9D4SJQ' },
                body: formData
            })
            .then(res => res.blob())
            .then(blob => {
                loading.style.display = 'none';
                toolsSection.style.display = 'block';
                bgSelector.style.display = 'block';

                const url = URL.createObjectURL(blob);
                cutOutImg.onload = () => {
                    renderComposite('none');
                };
                cutOutImg.src = url;
            })
            .catch(err => {
                loading.style.display = 'none';
                toolsSection.style.display = 'block';
                alert('Error removing background!');
            });
        });

        europeBgSelect.addEventListener('change', (e) => {
            renderComposite(e.target.value);
        });

        customBgBtn.addEventListener('click', () => {
            customBgInput.value = null;
            customBgInput.click();
        });

        customBgInput.addEventListener('change', (e) => {
            const bgFile = e.target.files[0];
            if (bgFile) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const customImg = new Image();
                    customImg.onload = () => {
                        canvas.width = cutOutImg.width;
                        canvas.height = cutOutImg.height;
                        ctx.drawImage(customImg, 0, 0, canvas.width, canvas.height);
                        ctx.drawImage(cutOutImg, 0, 0);
                        updateDownload();
                    };
                    customImg.src = event.target.result;
                }
                reader.readAsDataURL(bgFile);
            }
        });

        function renderComposite(bgKey) {
            canvas.width = cutOutImg.width;
            canvas.height = cutOutImg.height;

            if (bgKey === 'none') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(cutOutImg, 0, 0);
                updateDownload();
            } else if (bgKey === 'white' || bgKey === 'blue' || bgKey === 'red') {
                ctx.fillStyle = bgKey === 'white' ? '#ffffff' : (bgKey === 'blue' ? '#0055ff' : '#ff0000');
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(cutOutImg, 0, 0);
                updateDownload();
            } else if (europeBgUrls[bgKey]) {
                const bgImg = new Image();
                bgImg.crossOrigin = "anonymous";
                bgImg.onload = () => {
                    ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
                    ctx.drawImage(cutOutImg, 0, 0);
                    updateDownload();
                };
                bgImg.src = europeBgUrls[bgKey];
            }
        }

        function updateDownload() {
            downloadBtn.href = canvas.toDataURL('image/png');
            downloadBtn.style.display = 'block';
        }
    </script>

</body>
</html>
