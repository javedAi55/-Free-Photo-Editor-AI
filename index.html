
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Photo Editor AI - جاوید اے آئی ٹولز</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #1e3c72; font-size: 24px; }
        p { font-size: 15px; color: #555; }
        .action-btn {
            display: block;
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
        }
        .bg-btn { background-color: #e67e22; }
        .download-btn { background-color: #8e44ad; display: none; }
        #preview, #result {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        #loading {
            display: none;
            color: #e67e22;
            font-weight: bold;
            margin: 15px 0;
        }
        .ad-box {
            margin-top: 25px;
            padding: 15px;
            background: #fdf6ec;
            border: 2px dashed #f39c12;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎨 Free Photo Editor AI</h1>
        <p>مفت اے آئی ٹولز - بیک گراؤنڈ ریموو کریں!</p>
        
        <hr>

        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <button class="action-btn" id="uploadTriggerBtn">🖼️ تصویر منتخب کریں (Upload)</button>

        <img id="preview" src="" alt="اصلی تصویر" style="display: none;">
        
        <div id="loading">⏳ اے آئی بیک گراؤنڈ ختم کر رہی ہے، برائے مہربانی چند سیکنڈ انتظار کریں...</div>

        <img id="result" src="" alt="بغیر بیک گراؤنڈ کی تصویر" style="display: none;">

        <div id="toolsSection" style="display: none; margin-top: 15px;">
            <button class="action-btn bg-btn" id="removeBgBtn">✂️ بیک گراؤنڈ ریموو کریں (Remove BG)</button>
            <a id="downloadBtn" class="action-btn download-btn" download="no-bg-image.png">📥 تصویر ڈاؤن لوڈ کریں (Download)</a>
        </div>

        <div class="ad-box">
            <p>📢 <strong>گوگل ایڈسینس سپیس (Google Ads)</strong></p>
            <small>یہاں آپ کے کمائی والے اشتہارات لائیو ہوں گے!</small>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const uploadTriggerBtn = document.getElementById('uploadTriggerBtn');
        const preview = document.getElementById('preview');
        const result = document.getElementById('result');
        const toolsSection = document.getElementById('toolsSection');
        const removeBgBtn = document.getElementById('removeBgBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const loading = document.getElementById('loading');

        let selectedFile = null;

        uploadTriggerBtn.addEventListener('click', function() {
            imageInput.value = null;
            imageInput.click();
        });

        imageInput.addEventListener('change', function(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    result.style.display = 'none';
                    downloadBtn.style.display = 'none';
                    toolsSection.style.display = 'block';
                }
                reader.readAsDataURL(selectedFile);
            }
        });

        // اصلی اے آئی بیک گراؤنڈ ریموو فنکشن
        removeBgBtn.addEventListener('click', function() {
            if (!selectedFile) return;

            loading.style.display = 'block';
            toolsSection.style.display = 'none';

            const formData = new FormData();
            formData.append('image_file', selectedFile);
            formData.append('size', 'auto');

            fetch('https://api.remove.bg/v1.0/removebg', {
                method: 'POST',
                headers: {
                    'X-Api-Key': 'XGEnbBRh8E65Nx64ja9D4SJQ'
                },
                body: formData
            })
            .then(response => response.blob())
            .then(blob => {
                loading.style.display = 'none';
                toolsSection.style.display = 'block';
                const url = URL.createObjectURL(blob);
                result.src = url;
                result.style.display = 'block';
                preview.style.display = 'none';
                downloadBtn.href = url;
                downloadBtn.style.display = 'block';
            })
            .catch(error => {
                loading.style.display = 'none';
                toolsSection.style.display = 'block';
                alert('بیک گراؤنڈ ریموو کرنے میں مسئلہ آیا ہے، دوبارہ کوشش کریں۔');
                console.error(error);
            });
        });
    </script>

</body>
</html>
