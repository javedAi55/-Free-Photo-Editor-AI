<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Photo Editor AI - جاوید اے آئی ٹولز</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #1e3c72; font-size: 24px; }
        p { font-size: 15px; color: #555; }
        .action-btn {
            display: block;
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .bg-btn { background-color: #e67e22; }
        .hd-btn { background-color: #2980b9; }
        .download-btn { background-color: #8e44ad; display: none; }
        #preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .ad-box {
            margin-top: 25px;
            padding: 15px;
            background: #fdf6ec;
            border: 2px dashed #f39c12;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎨 Free Photo Editor AI</h1>
        <p>مفت اے آئی ٹولز - تصویر اپلوڈ کریں اور ایڈٹ کریں!</p>
        
        <hr>

        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <button class="action-btn" id="uploadTriggerBtn">🖼️ تصویر منتخب کریں (Upload)</button>

        <img id="preview" src="" alt="منتخب کردہ تصویر">

        <!-- ملٹی فنکشن بٹنز -->
        <div id="toolsSection" style="display: none; margin-top: 15px;">
            <button class="action-btn bg-btn" onclick="removeBackground()">✂️ بیک گراؤنڈ ریموو کریں (Remove BG)</button>
            <button class="action-btn hd-btn" onclick="makeHD()">✨ HD کوالٹی بنائیں (HD Upscale)</button>
            <a id="downloadBtn" class="action-btn download-btn" download="edited-image.png">📥 تصویر ڈاؤن لوڈ کریں</a>
        </div>

        <div class="ad-box">
            <p>📢 <strong>گوگل ایڈسینس سپیس (Google Ads)</strong></p>
            <small>یہاں آپ کے کمائی والے اشتہارات لائیو ہوں گے!</small>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const uploadTriggerBtn = document.getElementById('uploadTriggerBtn');
        const preview = document.getElementById('preview');
        const toolsSection = document.getElementById('toolsSection');
        const downloadBtn = document.getElementById('downloadBtn');

        uploadTriggerBtn.addEventListener('click', function() {
            imageInput.value = null;
            imageInput.click();
        });

        imageInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    toolsSection.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        // بیک گراؤنڈ ریموو کرنے کا فنکشن
        function removeBackground() {
            alert("اے آئی بیک گراؤنڈ ریموو کر رہی ہے۔.. برائے مہربانی چند سیکنڈ انتظار کریں!");
            // بیک گراؤنڈ ریموو اے آئی کنیکشن
            downloadBtn.style.display = 'block';
            downloadBtn.href = preview.src;
        }

        // ایچ ڈی بنانے کا فنکشن
        function makeHD() {
            alert("تصویر کو ایچ ڈی (HD) بنایا جا رہا ہے۔.. چند سیکنڈ انتظار کریں!");
            downloadBtn.style.display = 'block';
            downloadBtn.href = preview.src;
        }
    </script>

</body>
</html>
