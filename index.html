<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Photo Editor AI - جاوید اے آئی ٹولز</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1e3c72;
            font-size: 24px;
        }
        p {
            font-size: 16px;
            color: #555;
        }
        .upload-btn {
            display: block;
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 14px;
            margin: 15px 0;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .upload-btn:hover {
            background-color: #219150;
        }
        .ad-box {
            margin-top: 25px;
            padding: 15px;
            background: #fdf6ec;
            border: 2px dashed #f39c12;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎨 Free Photo Editor AI</h1>
        <p>مفت اے آئی ٹولز - تصویروں کا بیک گراؤنڈ ہٹائیں اور ایڈیٹنگ کریں!</p>
        
        <hr>

        <h3>✨ اپلوڈ کریں اور میجک دیکھیں:</h3>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="alert('تصویر منتخب ہو گئی ہے! پروسیسنگ شروع ہو رہی ہے۔..')">
        <button class="upload-btn" onclick="document.getElementById('imageInput').click();">🖼️ تصویر اپلوڈ کریں (Upload Photo)</button>

        <div class="ad-box">
            <p>📢 <strong>گوگل ایڈسینس سپیس (Ads Space)</strong></p>
            <small>یہاں آپ کے کمائی والے اشتہارات لائیو ہوں گے!</small>
        </div>
    </div>

</body>
</html>
