<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Photo Editor AI - جاوید اے آئی ٹولز</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #1e3c72; font-size: 24px; }
        p { font-size: 15px; color: #555; }
        .upload-btn {
            display: block;
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 14px;
            margin: 15px 0;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        #preview {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .ad-box {
            margin-top: 25px;
            padding: 15px;
            background: #fdf6ec;
            border: 2px dashed #f39c12;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎨 Free Photo Editor AI</h1>
        <p>مفت اے آئی ٹولز - تصویر اپلوڈ کریں اور دیکھیں!</p>
        
        <hr>

        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="showImage(event)">
        <button class="upload-btn" onclick="document.getElementById('imageInput').click();">🖼️ تصویر اپلوڈ کریں (Upload Photo)</button>

        <!-- تصویر یہاں سکرین پر دکھے گی -->
        <img id="preview" src="" alt="اپلوڈ شدہ تصویر">

        <div class="ad-box">
            <p>📢 <strong>گوگل ایڈسینس سپیس (Google Ads)</strong></p>
            <small>یہاں آپ کے کمائی والے اشتہارات لائیو ہوں گے!</small>
        </div>
    </div>

    <script>
        function showImage(event) {
            var reader = new FileReader();
            reader.onload = function(){
                var output = document.getElementById('preview');
                output.src = reader.result;
                output.style.display = 'block';
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>

</body>
</html>
