<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاوید اے آئی ٹولز - Javed AI Tools</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
        }
        p {
            font-size: 18px;
            color: #555;
        }
        .btn {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            padding: 12px 25px;
            margin: 10px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #219150;
        }
        .ad-box {
            margin-top: 30px;
            padding: 15px;
            background: #eef2f7;
            border: 1px dashed #7f8c8d;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 جاوید اے آئی ٹولز (Javed AI Tools)</h1>
        <p>خوش آمدید! یہاں آپ کو تمام اے آئی ٹولز بالکل مفت ملیں گے۔</p>
        
        <hr>

        <h3>✨ ہمارے جدید اے آئی ٹولز:</h3>
        <button class="btn" onclick="alert('بیک گراؤنڈ ریموو ٹول عنقریب لائیو ہو رہا ہے!')">🖼️ بیک گراؤنڈ ریموو کریں</button>
        <button class="btn" onclick="alert('اے آئی کوٹس ٹول جلد دستیاب ہوگا!')">💡 اے آئی کوٹس جنیریٹر</button>
        
        <div class="ad-box">
            <p>📢 <strong>گوگل ایڈسینس سپیس (Google Ads Space)</strong></p>
            <small>یہاں آپ کے اشتہارات چلیں گے جن سے ڈالروں میں کمائی ہوگی!</small>
        </div>
    </div>

</body>
</html>
